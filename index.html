function dentroVentana(i, w){
  return w[0] <= w[1] ? (i>=w[0] && i<=w[1]) : (i>=w[0] || i<=w[1]);
}

/* ---------- interacciones de la ficha ---------- */
function initProducto(id){
  var V = PVIS[id]; if(!V) return;

  /* calendario */
  var cal = document.getElementById('cal12'), note = document.getElementById('cal-note');
  if(cal){
    var primera = +Object.keys(V.cal.notas)[0];
    marcaMes(primera);
    cal.addEventListener('click', function(e){
      var b = e.target.closest('button[data-m]'); if(!b) return;
      marcaMes(+b.getAttribute('data-m'));
    });
  }
  function marcaMes(i){
    Array.prototype.forEach.call(cal.querySelectorAll('button'), function(b){
      b.classList.toggle('on', +b.getAttribute('data-m')===i);
    });
    var txt = V.cal.notas[i];
    var niv = ['sin actividad de cosecha registrada en la referencia','actividad baja','actividad media','actividad alta'][V.cal.m[i]];
    note.innerHTML = '<span class="mes">'+MESES[i]+'</span>' + (txt ? txt : 'Mes de '+niv+' en la referencia sectorial. Por validar con el cliente.');
  }

  /* cadena de valor */
  var chain = document.getElementById('chain'), cdet = document.getElementById('chain-det');
  function pintaPaso(i){
    var c = V.cadena[i];
    cdet.innerHTML = '<h5>'+('0'+(i+1)).slice(-2)+' · '+c.t+'</h5><p>'+c.d+'</p>'+
      '<p class="fuga"><b>Punto de fuga por validar.</b> '+c.fuga+'</p>';
    Array.prototype.forEach.call(chain.querySelectorAll('button'), function(b){
      b.classList.toggle('on', +b.getAttribute('data-c')===i);
    });
  }
  if(chain){
    pintaPaso(0);
    chain.addEventListener('click', function(e){
      var b = e.target.closest('button[data-c]'); if(!b) return;
      pintaPaso(+b.getAttribute('data-c'));
    });
  }

  /* simulador */
  var S = {}; for(var k in V.sim){ S[k] = V.sim[k]; }
  var cont = document.getElementById('sim-controls');
  if(!cont) return;
  var RANGOS = {}, B = BENCH[id] || {};
  cont.innerHTML = SL_DEF.map(function(d){
    var r = rango(d, V.sim[d.k]); RANGOS[d.k] = r;
    var marcas = '', pie = '';
    var b = d.bench ? B[d.bench] : null;
    if(b){
      function pos(v){ return Math.max(0, Math.min(100, (v-r.min)/(r.max-r.min)*100)); }
      marcas = '<span class="marks">'+
        '<i class="mk media" style="left:'+pos(b.media).toFixed(1)+'%"></i>'+
        (b.best!=null ? '<i class="mk best" style="left:'+pos(b.best).toFixed(1)+'%"></i>' : '')+
        '</span>';
      pie = '<span class="bench"><i class="mk media"></i>'+b.t+(b.best!=null?' <i class="mk best"></i>':'')+
            '<em id="gap-'+d.k+'"></em></span>';
    }
    return '<div class="sl'+(b?' has-bench':'')+'"><label for="sl-'+d.k+'">'+d.l+' <b id="v-'+d.k+'"></b></label>'+
      '<span class="trackwrap"><input type="range" id="sl-'+d.k+'" data-k="'+d.k+'" min="'+r.min+'" max="'+r.max+'" step="'+r.step+'" value="'+S[d.k]+'">'+marcas+'</span>'+pie+'</div>';
  }).join('');
  SL_DEF.forEach(function(d){
    document.getElementById('sl-'+d.k).addEventListener('input', function(e){
      S[d.k] = +e.target.value; pinta();
    });
  });

  function pinta(){
    SL_DEF.forEach(function(d){
      var v = S[d.k];
      var dec = d.dec || (RANGOS[d.k].step < 1 ? 1 : 0);
      document.getElementById('v-'+d.k).textContent = (d.fmt==='k' ? '$'+nf(v/1000)+' k' : nf(v, dec)+d.u);
      var r = RANGOS[d.k], pct = ((v-r.min)/Math.max(0.0001,(r.max-r.min))*100).toFixed(1);
      document.getElementById('sl-'+d.k).style.background =
        'linear-gradient(90deg,var(--green-600) 0 '+pct+'%,var(--n200) '+pct+'% 100%)';
      var b = d.bench ? (BENCH[id]||{})[d.bench] : null, g = document.getElementById('gap-'+d.k);
      if(b && g){
        var meta = (b.best!=null ? b.best : b.media);
        var dif = (v-meta)/meta*100;
        g.textContent = Math.abs(dif) < 1 ? ' · en la referencia'
          : (dif > 0 ? ' · ' + nf(dif,0) + '% arriba de la referencia'
                     : ' · ' + nf(-dif,0) + '% por alcanzar');
        g.className = dif >= -1 ? 'up' : '';
      }
    });
    var r = calcula(S);
    document.getElementById('sim-kpis').innerHTML =
      '<div><b>'+nf(r.t)+' t</b><span>Producción de la superficie</span></div>'+
      '<div><b>'+mxn(r.ingreso)+'</b><span>Ingreso del ciclo en MXN</span></div>'+
      '<div><b>$'+nf(r.costoKg,2)+'</b><span>Costo por kilo en MXN</span></div>'+
      '<div class="'+(r.margenHa<0?'neg':'hi')+'"><b>'+mxn(r.margenHa)+'</b><span>Margen por hectárea en MXN</span></div>'+
      '<div><b>'+nf(r.kgJornal,1)+' kg</b><span>Kilos por jornal</span></div>'+
      '<div><b>$'+nf(r.pEq,2)+'</b><span>Precio de equilibrio por kilo en MXN</span></div>';
    curva(r);
    palancas();
  }

  function curva(r){
    var svg = document.getElementById('sim-curva');
    var W=560,H=196, L=56,R=12,T=22,B=26;
    var p0 = S.precio*0.55, p1 = S.precio*1.5, n=40, pts=[];
    for(var i=0;i<=n;i++){
      var pr = p0 + (p1-p0)*i/n;
      var c = calcula(Object.assign({}, S, {precio:pr}));
      pts.push([pr, c.margenHa]);
    }
    var ys = pts.map(function(a){return a[1];});
    var ymin = Math.min.apply(null, ys.concat([0])), ymax = Math.max.apply(null, ys.concat([0]));
    var pad=(ymax-ymin)*0.12 || 1; ymin-=pad; ymax+=pad;
    function X(v){ return L + (v-p0)/(p1-p0)*(W-L-R); }
    function Y(v){ return T + (ymax-v)/(ymax-ymin)*(H-T-B); }
    var d = pts.map(function(a,i){ return (i?'L':'M')+X(a[0]).toFixed(1)+' '+Y(a[1]).toFixed(1); }).join(' ');
    var area = d + ' L'+X(p1).toFixed(1)+' '+Y(0).toFixed(1)+' L'+X(p0).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
    var g = '';
    g += '<path d="'+area+'" fill="var(--green-200)" opacity=".55"></path>';
    g += '<line x1="'+L+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--n300)" stroke-width="1"></line>';
    g += '<path d="'+d+'" fill="none" stroke="var(--green-700)" stroke-width="2.4" stroke-linejoin="round"></path>';
    var r2 = calcula(S);
    g += '<line x1="'+X(r2.pEq).toFixed(1)+'" y1="'+T+'" x2="'+X(r2.pEq).toFixed(1)+'" y2="'+(H-B)+'" stroke="var(--cereza)" stroke-width="1.4" stroke-dasharray="4 4"></line>';
    g += '<text x="'+L+'" y="'+(H-7)+'" font-size="11" fill="var(--n600)" font-weight="700">$'+nf(p0,1)+' / kg</text>';
    g += '<text x="'+(W-R)+'" y="'+(H-7)+'" font-size="11" fill="var(--n600)" font-weight="700" text-anchor="end">$'+nf(p1,1)+' / kg</text>';
    var xe = Math.min(W-R-34, Math.max(L+34, X(r2.pEq)));
    g += '<text x="'+xe.toFixed(1)+'" y="'+(T+9)+'" font-size="10.5" fill="var(--cereza)" font-weight="800" text-anchor="middle">equilibrio $'+nf(r2.pEq,2)+'</text>';
    g += '<text x="4" y="'+(T+10)+'" font-size="11" fill="var(--n600)" font-weight="700">'+mxn(ymax)+'</text>';
    g += '<text x="4" y="'+(H-B)+'" font-size="11" fill="var(--n600)" font-weight="700">'+mxn(ymin)+'</text>';
    svg.innerHTML = g;
  }

  function palancas(){
    var base = calcula(S).margen;
    var defs = [
      ['Rendimiento', {rend:S.rend*1.05}],
      ['Precio', {precio:S.precio*1.05}],
      ['Fruta de primera', {prim:Math.min(100,S.prim*1.05)}],
      ['Costo por ha', {costoHa:S.costoHa*0.95}],
      ['Jornales por ha', {jornales:S.jornales*0.95}],
      ['Costo por jornal', {jornal:S.jornal*0.95}]
    ];
    var res = defs.map(function(d){
      return {k:d[0], v: calcula(Object.assign({}, S, d[1])).margen - base};
    }).sort(function(a,b){ return b.v - a.v; });
    var max = Math.max.apply(null, res.map(function(r){ return Math.abs(r.v); })) || 1;
    document.getElementById('sim-palancas').innerHTML = res.map(function(r,i){
      return '<div class="row'+(i===0?' top':'')+'"><span class="k">'+r.k+'</span>'+
        '<span class="bar"><i style="width:'+(Math.abs(r.v)/max*100).toFixed(1)+'%"></i></span>'+
        '<span class="v">'+mxn(r.v)+'</span></div>';
    }).join('');
  }

  pinta();
}

function initIA2(){
  var grid = document.getElementById('opp-grid');
  var det = document.getElementById('opp-detail');
  var filtros = document.getElementById('opp-filtros');
  var horiz = 'todos', sel = OPORTUNIDADES[0].id;
  function hzDe(id){
    for(var i=0;i<IA_HORIZONTES.length;i++){ if(IA_HORIZONTES[i].opps.indexOf(id)>=0) return IA_HORIZONTES[i]; }
    return null;
  }
  function pinta(){
    var lista = OPORTUNIDADES.filter(function(o){
      if(horiz==='todos') return true;
      var z = hzDe(o.id); return z && z.id===horiz;
    });
    if(lista.length && !lista.some(function(o){return o.id===sel;})) sel = lista[0].id;
    grid.innerHTML = lista.map(function(o){
      var z = hzDe(o.id);
      return '<button class="opp'+(o.id===sel?' on':'')+'" data-o="'+o.id+'">'+
        '<span class="area">'+o.area+'</span><span class="t">'+o.t+'</span><span class="d">'+o.d+'</span>'+
        '<span class="meta"><span class="cx '+o.cx+'">Complejidad '+o.cx+'</span>'+(z?'<span class="cx hz-tag">'+z.t+'</span>':'')+'</span></button>';
    }).join('');
    var o = null;
    for(var i=0;i<OPORTUNIDADES.length;i++){ if(OPORTUNIDADES[i].id===sel){ o=OPORTUNIDADES[i]; break; } }
    det.innerHTML = oppDetail(o);
  }
  filtros.addEventListener('click', function(e){
    var b = e.target.closest('.pill-select'); if(!b) return;
    horiz = b.getAttribute('data-h');
    Array.prototype.forEach.call(filtros.querySelectorAll('.pill-select'), function(x){ x.classList.toggle('on', x===b); });
    pinta();
  });
  grid.addEventListener('click', function(e){
    var b = e.target.closest('.opp'); if(!b) return;
    sel = b.getAttribute('data-o'); pinta();
  });
  pinta();
}

tabsEl.innerHTML = SECCIONES.map(function(s){
  return '<button class="tab" role="tab" data-s="'+s.id+'" aria-selected="false"><span class="no">'+s.no+'.</span> '+s.t+'</button>';

var actual = null;
function abrir(id, push){
  var s = null;
  for(var i=0;i<SECCIONES.length;i++){ if(SECCIONES[i].id===id){ s=SECCIONES[i]; break; } }
  if(!s){ s = SECCIONES[0]; id = s.id; }
  if(actual===id) return;
  actual = id;
  mainEl.innerHTML = '<section class="room'+(id==='overview'?' dark':'')+'" id="sec-'+id+'">'+s.r()+'</section>';
  Array.prototype.forEach.call(tabsEl.querySelectorAll('button.tab'), function(b){
    var on = b.getAttribute('data-s')===id;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on?'true':'false');
    if(on){
      var x = b.offsetLeft - (tabsEl.clientWidth - b.offsetWidth)/2;
      if(tabsEl.scrollWidth > tabsEl.clientWidth){
        try{ tabsEl.scrollTo({left:Math.max(0,x), behavior:'smooth'}); }catch(e){ tabsEl.scrollLeft = Math.max(0,x); }
      }
    }
  });
  window.scrollTo(0,0);
  if(push){ try{ location.hash = id; }catch(e){} }
  if(id==='berries') initBerries();
  if(id==='mapa') initMapa();
  if(id==='jornada') initJornada();
  if(id==='ia') initIA2();
  if(id==='predx') initFuentes();
  if(['esparrago','aguacate','papa','semilla'].indexOf(id)>=0) initProducto(id);
}
tabsEl.addEventListener('click', function(e){
  var b = e.target.closest('button.tab'); if(!b) return;

});

  var id = (location.hash||'').replace('#','');

/* ---------- jornada ---------- */
function initJornada(){
  var cont = document.getElementById('j-controls');
  if(!cont) return;
  var S = {personas:100, horas:52, semanas:12, costo:60};
  var D = [
   {k:'personas', l:'Personas en el pico', min:10, max:2000, step:10, u:' personas'},
   {k:'horas',    l:'Horas por semana hoy', min:40, max:72, step:1, u:' h'},
   {k:'semanas',  l:'Semanas de temporada alta', min:1, max:30, step:1, u:' semanas'},
   {k:'costo',    l:'Costo por hora', min:0, max:400, step:5, u:' $/h'}
  ];
  cont.innerHTML = D.map(function(d){
    return '<div class="sl"><label for="j-'+d.k+'">'+d.l+' <b id="jv-'+d.k+'"></b></label>'+
      '<span class="trackwrap"><input type="range" id="j-'+d.k+'" min="'+d.min+'" max="'+d.max+'" step="'+d.step+'" value="'+S[d.k]+'"></span></div>';
  }).join('');
  D.forEach(function(d){
    document.getElementById('j-'+d.k).addEventListener('input', function(e){ S[d.k] = +e.target.value; pinta(); });
  });
  function pinta(){
    D.forEach(function(d){
      document.getElementById('jv-'+d.k).textContent = nf(S[d.k])+d.u;
      var pct = ((S[d.k]-d.min)/(d.max-d.min)*100).toFixed(1);
      document.getElementById('j-'+d.k).style.background =
        'linear-gradient(90deg,var(--green-600) 0 '+pct+'%,var(--n200) '+pct+'% 100%)';
    });
    var tope = 46;
    var exceso = Math.max(0, S.horas - tope);
    var horasSem = exceso * S.personas;
    var personasEq = horasSem / tope;
    var costoTemp = horasSem * S.semanas * S.costo;
    document.getElementById('j-out').innerHTML =
      '<div><b>46 h</b><span>Tope legal desde el 1 de enero de 2027</span></div>'+
      '<div class="'+(exceso>0?'neg':'')+'"><b>'+nf(exceso)+' h</b><span>Horas por persona por semana sobre el tope</span></div>'+
      '<div><b>'+nf(horasSem)+'</b><span>Horas por semana a reubicar en el pico</span></div>'+
      '<div class="hi"><b>'+nf(personasEq,1)+'</b><span>Personas equivalentes para cubrir la misma carga</span></div>'+
      '<div><b>'+(S.costo>0 ? mxn(costoTemp) : '—')+'</b><span>'+(S.costo>0 ? 'Costo de esas horas en la temporada' : 'Escriba un costo por hora')+'</span></div>'+
      '<div><b>'+nf(S.horas*S.personas)+'</b><span>Horas totales por semana en el pico</span></div>';
    var topes = [['2026',48],['2027',46],['2028',44],['2029',42],['2030',40]];
    var vals = topes.map(function(t){ return Math.max(0, S.horas - t[1]) * S.personas; });
    var max = Math.max.apply(null, vals) || 1;
    document.getElementById('j-anios').innerHTML = topes.map(function(t,i){
      return '<div class="row'+(t[0]==='2027'?' top':'')+'"><span class="k">'+t[0]+' · '+t[1]+' h</span>'+
        '<span class="bar"><i style="width:'+(vals[i]/max*100).toFixed(1)+'%"></i></span>'+
        '<span class="v">'+nf(vals[i])+'</span></div>';
    }).join('');
  }
  pinta();
}

/* ---------- mapa ---------- */
function initMapa(){
  var svg = document.getElementById('mx-map');
  var stage = document.getElementById('mx-stage');
  var det = document.getElementById('mx-detail');
  var filtros = document.getElementById('mx-filtros');
  if(!svg) return;
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for(var k in attrs){ e.setAttribute(k, attrs[k]); }
    if(parent) parent.appendChild(e);
    return e;
  }
  var gEst = el('g', {}, svg);
  MX_ESTADOS.forEach(function(s){
    el('path', {'class':'mx-st'+(ESTADOS_OP.indexOf(s.n)>=0?' op':''), d:s.d}, gEst);
  });
  el('path', {'class':'mx-pais', d:MX_PAIS, fill:'none','aria-hidden':'true'}, svg);
  var gPins = el('g', {}, svg);
  var sel = null, filtro = 'todos';

  var orden = {indicio:0, alianza:1, planta:2, corporativo:3};
  UBICACIONES.slice().sort(function(a,b){ return orden[a.tipo]-orden[b.tipo]; }).forEach(function(u){
    var g = el('g', {'class':'mx-pin '+u.tipo, tabindex:'0', role:'button','aria-label':u.n+', '+u.e+': '+u.rol}, gPins);
    el('circle', {'class':'halo', cx:u.x, cy:u.y, r:13}, g);
    el('circle', {'class':'core', cx:u.x, cy:u.y, r:6}, g);
    if(u.lbl !== false){
      var anc = u.la || 'start', sg = (anc==='end' ? -1 : 1);
      var t = el('text', {'class':'lbl', x:u.x + sg*11, y:u.y + 4 + (u.ldy||0), 'font-size':13, 'text-anchor':anc}, g);
      t.textContent = u.n;
    }
    u._g = g;
    function act(){ elegir(u.n); }
    g.addEventListener('click', act);
    g.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
  });

  filtros.innerHTML = '<span class="lab">Filtrar</span><button class="pill-select on" data-t="todos">Todas</button>'+
    Object.keys(TIPOS).map(function(k){ return '<button class="pill-select" data-t="'+k+'">'+TIPOS[k].t+'</button>'; }).join('');
  filtros.addEventListener('click', function(e){
    var b = e.target.closest('.pill-select'); if(!b) return;
    filtro = b.getAttribute('data-t');
    Array.prototype.forEach.call(filtros.querySelectorAll('.pill-select'), function(x){ x.classList.toggle('on', x===b); });
    aplicar();
  });
  function aplicar(){
    UBICACIONES.forEach(function(u){
      var vis = (filtro==='todos' || u.tipo===filtro);
      u._g.classList.toggle('dim', !vis);
      u._g.style.pointerEvents = vis ? 'auto' : 'none';
    });
  }
  function elegir(nombre){
    sel = nombre;
    var u = null;
    for(var i=0;i<UBICACIONES.length;i++){ if(UBICACIONES[i].n===nombre){ u=UBICACIONES[i]; break; } }
    UBICACIONES.forEach(function(x){ x._g.classList.toggle('sel', x===u); });
    Array.prototype.forEach.call(document.querySelectorAll('tr[data-row]'), function(tr){
      tr.style.background = tr.getAttribute('data-row')===nombre ? 'var(--green-100)' : '';
    });
    if(!u){ det.innerHTML = vacio(); return; }
    var prods = u.prod.length ? u.prod.map(function(p){
      var nm = {berries:'Berries', papa:'Papa', semilla:'Semilla de papa', esparrago:'Espárrago', aguacate:'Aguacate'}[p] || p;
      return '<span class="chip-prod">'+nm+'</span>';
    }).join(' ') : '<span class="footnote">Cultivo no publicado por la empresa</span>';
    det.innerHTML = '<h3>'+u.n+'</h3><p class="sub">'+u.e+' · '+TIPOS[u.tipo].t+'</p>'+
      '<p style="font-weight:700;font-size:14.5px;margin-bottom:8px">'+u.rol+'</p>'+
      '<p>'+u.det+'</p>'+
      '<div class="block"><h4>Productos asociados</h4><div class="chips">'+prods+'</div></div>'+
      '<div class="block"><h4>Nivel de evidencia</h4><p>'+u.nivel+'</p></div>';
  }
  function vacio(){
    return '<h3>Seleccione una ubicación</h3><p class="sub">Cuatro ubicaciones con respaldo documental</p>'+
      '<p>Cada punto corresponde a una ubicación que la empresa declara en su sitio corporativo o que aparece en un expediente público. El color distingue el corporativo, la planta y las alianzas comerciales.</p>'+
      '<p style="margin-top:10px">Los estados sombreados son los cinco donde la empresa reporta presencia.</p>';
  }
  det.innerHTML = vacio();
  aplicar();

  document.querySelectorAll('tr[data-row]').forEach(function(tr){
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', function(){ var n = tr.getAttribute('data-row'); elegir(n); acercar(n); });
  });

  /* zoom y paneo */
  var VB = {x:-16, y:-16, w:1032, h:672};
  var vb = {x:VB.x, y:VB.y, w:VB.w, h:VB.h};
  function setVB(){
    svg.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
    var z = VB.w / vb.w;
    document.getElementById('mx-in').disabled = z > 7.9;
    document.getElementById('mx-out').disabled = z < 1.02;
    Array.prototype.forEach.call(svg.querySelectorAll('.mx-pin .lbl'), function(t){ t.setAttribute('font-size', 13/Math.sqrt(z)); });
    Array.prototype.forEach.call(svg.querySelectorAll('.mx-pin .core'), function(c){ c.setAttribute('r', 6/Math.sqrt(z)); });
    Array.prototype.forEach.call(svg.querySelectorAll('.mx-pin .halo'), function(c){ c.setAttribute('r', 13/Math.sqrt(z)); });
    Array.prototype.forEach.call(svg.querySelectorAll('.mx-pin .lbl'), function(t){
      var id = t.textContent, k = 1/Math.sqrt(z);
      for(var i=0;i<UBICACIONES.length;i++){
        var u = UBICACIONES[i];
        if(u.n===id){
          var sg = (u.la==='end' ? -1 : 1);
          t.setAttribute('x', u.x + sg*11*k);
          t.setAttribute('y', u.y + (4 + (u.ldy||0))*k);
        }
      }
    });
  }
  function zoom(f){
    var cx = vb.x + vb.w/2, cy = vb.y + vb.h/2;
    var nw = Math.min(VB.w, Math.max(VB.w/8, vb.w/f));
    var nh = nw * VB.h / VB.w;
    vb.w = nw; vb.h = nh; vb.x = cx - nw/2; vb.y = cy - nh/2;
    limitar(); setVB();
  }
  function limitar(){
    vb.x = Math.max(VB.x, Math.min(VB.x + VB.w - vb.w, vb.x));
    vb.y = Math.max(VB.y, Math.min(VB.y + VB.h - vb.h, vb.y));
  }
  function acercar(nombre){
    var u = null;
    for(var i=0;i<UBICACIONES.length;i++){ if(UBICACIONES[i].n===nombre){ u=UBICACIONES[i]; break; } }
    if(!u) return;
    vb.w = VB.w/3.2; vb.h = VB.h/3.2;
    vb.x = u.x - vb.w/2; vb.y = u.y - vb.h/2;
    limitar(); setVB();
  }
  document.getElementById('mx-in').addEventListener('click', function(){ zoom(1.6); });
  document.getElementById('mx-out').addEventListener('click', function(){ zoom(1/1.6); });
  document.getElementById('mx-reset').addEventListener('click', function(){ vb = {x:VB.x,y:VB.y,w:VB.w,h:VB.h}; setVB(); });
  var drag = null;
  svg.addEventListener('pointerdown', function(e){
    if(vb.w >= VB.w) return;
    drag = {x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y, w:stage.clientWidth};
    stage.classList.add('drag'); svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', function(e){
    if(!drag) return;
    var k = vb.w / drag.w;
    vb.x = drag.vx - (e.clientX - drag.x) * k;
    vb.y = drag.vy - (e.clientY - drag.y) * k;
    limitar(); setVB();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    svg.addEventListener(ev, function(){ drag = null; stage.classList.remove('drag'); });
  });
  setVB();
}

/* ---------- arranque ---------- */
var inicial = (location.hash||'').replace('#','');
abrir(inicial || 'overview', false);
