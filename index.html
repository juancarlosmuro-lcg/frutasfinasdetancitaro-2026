<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Prediagnóstico comercial independiente de Grupo Agrícola El Cerezo, construido con investigación pública verificable.">
<title>Agrícola El Cerezo | Pre-DX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!--
  Agrícola El Cerezo · Pre-DX · octubre de 2026
  Piel alineada al sistema de diseño de London Consulting Group (mismos tokens y componentes que la pieza de referencia),
  con el acento cromático desplazado del lima al rojo cereza para la identidad de El Cerezo.
  Regla de contenido: todo dato de la empresa proviene de fuentes públicas citadas en la pestaña Fuentes.
  No se incorpora información de proyectos previos de LCG con esta empresa.
-->
<style>
:root{
  --green-900:#073E38; --green-800:#085E54; --green-700:#0A7568; --green-600:#039271;
  --green-500:#03B585; --green-400:#2FCB9E; --green-300:#7FE0C0; --green-200:#BAF4E9; --green-100:#DFF9F0;
  --cereza:#085E54; --cereza-200:#DFF9F0; --cereza-300:#C9E265; --hoja:#C9E265; --lime:#C9E265;
  --neutral-0:#FFFEFC; --cream:#F2EEEB; --n100:#E9E3DC; --n200:#DCD4C9; --n300:#C2B8AB;
  --n400:#9A9086; --n500:#756C63; --n600:#574F49; --n700:#3D3733; --n800:#272320; --n900:#171512;
  --warn:#C98A1F; --warn-bg:#FBEED9; --err:#C0503F; --info:#2E7FB8; --info-bg:#DCEBF6;
  --font-sans:"Manrope","Helvetica Neue",Arial,sans-serif;
  --maxw:1180px;
  --padx:max(20px, calc((100% - var(--maxw)) / 2));
  --ease:cubic-bezier(0.16,1,0.3,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
body{
  margin:0;background:var(--cream);color:var(--n800);
  font-family:var(--font-sans);font-size:16.5px;line-height:1.55;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--green-900);z-index:60}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-0.02em;text-wrap:balance}
p{margin:0}
a{color:var(--green-700);text-underline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
img{max-width:100%}
svg{max-width:100%}
:focus-visible{outline:2.5px solid var(--green-500);outline-offset:3px;border-radius:3px}
[hidden]:not([hidden=until-found i]){display:none!important}
ul{margin:0;padding-left:18px}
li{margin:0 0 6px}
li:last-child{margin-bottom:0}

/* ---------- barra de navegación ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;color:var(--cream);
  background:linear-gradient(135deg,var(--green-900),#052d29)}
nav.rail .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;
  padding:14px var(--padx) 12px;border-bottom:1px solid rgba(186,244,233,.16)}
nav.rail .brand{display:flex;align-items:center;gap:16px;min-width:0}
.lockup{line-height:1.05;flex:none}
.lockup b{display:block;font-size:13.5px;font-weight:800;letter-spacing:.015em;color:var(--neutral-0)}
.lockup span{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green-300);font-weight:700;margin-top:3px}
nav.rail .prospect{border-left:1px solid rgba(186,244,233,.3);padding-left:16px;line-height:1.2;min-width:0}
nav.rail .prospect b{display:block;font-size:16px;font-weight:800;color:var(--neutral-0);letter-spacing:-.015em}
nav.rail .prospect span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cereza-300);font-weight:700;margin-top:3px}
nav.rail .foot{font-size:12px;color:var(--green-200);line-height:1.45;text-align:right}
nav.rail .foot b{color:var(--neutral-0);font-weight:700}
nav.rail .tabs{display:flex;gap:4px;overflow-x:auto;align-items:center;padding:8px var(--padx) 0;background:rgba(0,0,0,.16);scrollbar-width:none}
nav.rail .tabs::-webkit-scrollbar{display:none}
nav.rail button.tab{display:flex;gap:7px;align-items:baseline;padding:11px 13px;border-radius:8px 8px 0 0;border:0;background:transparent;
  color:rgba(242,238,235,.72);font-size:13px;font-weight:700;white-space:nowrap;flex:none;
  border-bottom:3px solid transparent;transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease)}
nav.rail button.tab .no{font-size:11.5px;font-weight:800;color:var(--green-200);letter-spacing:.06em}
nav.rail button.tab:hover{background:rgba(186,244,233,.08);color:var(--neutral-0)}
nav.rail button.tab.active{background:rgba(186,244,233,.12);color:var(--neutral-0);border-bottom-color:var(--cereza-300)}
nav.rail button.tab.active .no{color:var(--lime)}
@media (min-width:881px){nav.rail .tabs{gap:2px}nav.rail button.tab{padding:11px 10px}}

/* ---------- paneles ---------- */
main.scroller{flex:1;min-width:0}
section.room{padding:48px var(--padx) 64px;display:flex;flex-direction:column;gap:26px;min-width:0}
section.room.dark{background:linear-gradient(160deg,var(--green-900),#04302c 70%)}
.room-head{max-width:840px}
.room-head h2{font-size:clamp(27px,3.6vw,40px);font-weight:700;line-height:1.08;letter-spacing:-0.028em;margin:0 0 14px}
.room-head p{font-size:17px;color:var(--n600);line-height:1.58;max-width:70ch}
section.room.dark .room-head h2{color:var(--neutral-0)}
section.room.dark .room-head p{color:var(--green-100)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--green-800);font-weight:700}
.room-head .eyebrow{margin-bottom:14px}
.room-head .eyebrow::after{content:"";flex:1;height:1px;background:var(--n200)}
section.room.dark .eyebrow{color:var(--cereza-300)}
section.room.dark .room-head .eyebrow::after{background:rgba(186,244,233,.22)}

/* ---------- retículas ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,215px),1fr))}

/* ---------- tarjetas ---------- */
.card{background:var(--neutral-0);border:1px solid var(--n200);border-radius:14px;padding:22px;min-width:0}
.card h3{font-size:16.5px;font-weight:800;letter-spacing:-.012em;line-height:1.25;margin:0 0 4px}
.card .sub{font-size:13.5px;color:var(--n600);margin:0 0 14px;line-height:1.45}
.card p{font-size:14.2px;line-height:1.55}
.card li{font-size:14.2px;line-height:1.5}
section.room.dark .card{background:rgba(255,254,252,.055);border-color:rgba(186,244,233,.2);color:var(--green-100)}
section.room.dark .card h3{color:var(--neutral-0)}
section.room.dark .card .sub{color:var(--green-300)}

/* ---------- marcas del encabezado ---------- */
.mark-lcg{display:block;width:196px;height:auto;flex:none}
@media(max-width:620px){.mark-lcg{width:150px}}
.brand-sep{width:1px;align-self:stretch;min-height:34px;background:rgba(186,244,233,.32);flex:none}
.mark-cerezo{width:46px;height:46px;border-radius:50%;display:block;flex:none;
  box-shadow:0 0 0 1px rgba(186,244,233,.35)}
nav.rail .foot .pre{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--green-300)}
nav.rail .foot .fecha{display:block;font-size:15px;font-weight:800;color:var(--neutral-0);letter-spacing:-.01em;margin-top:3px}

/* ---------- portada con tarjeta de alianza ---------- */
.hero-split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:38px;align-items:start}
@media(max-width:1040px){.hero-split{grid-template-columns:1fr;gap:26px}.hero-split .cpn-card{max-width:440px}}

/* ---------- ficha de producto: cintillo ---------- */
.p-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;background:var(--n200);
  border:1px solid var(--n200);border-radius:14px;overflow:hidden}
.p-hero div{background:var(--neutral-0);padding:15px 17px;min-width:0}
.p-hero b{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--green-800);font-weight:800}
.p-hero span{display:block;font-size:14.2px;line-height:1.4;color:var(--n700);margin-top:6px;font-weight:600}

/* ---------- calendario ---------- */
.cal12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cal12 button{border:0;padding:0;background:transparent;display:block;text-align:center}
.cal12 .m{display:block;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--n500);text-transform:uppercase;margin-bottom:5px}
.cal12 .bar{display:block;height:38px;border-radius:7px;background:var(--n100);position:relative;overflow:hidden;transition:transform .16s var(--ease)}
.cal12 button:hover .bar{transform:translateY(-2px)}
.cal12 .bar i{display:block;position:absolute;left:0;right:0;bottom:0;display:block;background:var(--green-600);border-radius:7px}
.cal12 .i1 i{height:34%;background:var(--green-300)}
.cal12 .i2 i{height:66%;background:var(--green-500)}
.cal12 .i3 i{height:100%;background:var(--green-800)}
.cal12 button.on .bar{box-shadow:0 0 0 2px var(--cereza)}
.cal12 .win{position:absolute;inset:0;border-top:3px solid var(--cereza);border-radius:7px}
.cal-note{font-size:13.6px;line-height:1.5;color:var(--n700);margin-top:12px;min-height:40px}
@media(max-width:620px){.cal12{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}}

/* ---------- cadena de valor ---------- */
.chain{display:flex;gap:6px;flex-wrap:wrap}
.chain button{flex:1 1 130px;min-width:0;text-align:left;border:1px solid var(--n200);background:var(--neutral-0);
  border-radius:11px;padding:11px 12px;transition:border-color .16s var(--ease),background .16s var(--ease)}
.chain button:hover{border-color:var(--green-500)}
.chain button.on{background:var(--green-800);border-color:var(--green-800);color:#fff}
.chain .n{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--green-700)}
.chain button.on .n{color:var(--green-300)}
.chain .t{font-size:13.4px;font-weight:800;line-height:1.25;margin-top:4px;display:block}
.chain-detail{margin-top:14px;background:var(--cream);border-radius:12px;padding:15px 17px}
.chain-detail h5{margin:0 0 6px;font-size:14.5px;font-weight:800}
.chain-detail p{font-size:14px;line-height:1.5;color:var(--n700)}
.chain-detail .fuga{margin-top:10px;font-size:13.4px;color:#7A520E;background:var(--warn-bg);border-radius:9px;padding:9px 12px;line-height:1.45}

/* ---------- simulador ---------- */
.sim{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.sim{grid-template-columns:1fr}}
.sl{margin-bottom:13px}
.sl label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.2px;font-weight:700;color:var(--n600)}
.sl label b{font-size:13.5px;font-weight:800;color:var(--green-800);font-variant-numeric:tabular-nums}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:999px;background:var(--n200);margin-top:9px}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--green-700);border:2px solid var(--neutral-0);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
.sl input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--green-700);
  border:2px solid var(--neutral-0);cursor:pointer}
.sim-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr));gap:9px}
.sim-kpis div{background:var(--cream);border-radius:11px;padding:12px 13px;min-width:0}
.sim-kpis b{display:block;font-weight:300;font-size:25px;line-height:1.03;letter-spacing:-.03em;color:var(--green-800);overflow-wrap:anywhere}
.sim-kpis span{display:block;font-size:11.5px;font-weight:700;color:var(--n600);margin-top:5px;line-height:1.3}
.sim-kpis div.hi{background:var(--green-200)}
.sim-kpis div.hi b{color:var(--green-900)}
.chartbox{margin-top:16px;border:1px solid var(--n200);border-radius:12px;padding:14px 16px;background:var(--neutral-0)}
.chartbox h5{margin:0;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--green-800)}
.chartbox p.cap{font-size:12.3px;color:var(--n600);margin-top:4px;line-height:1.45}
.chartbox svg{display:block;width:100%;height:auto;margin-top:10px}
.lev{display:grid;grid-auto-rows:30px;gap:10px;margin-top:14px;align-content:start}
.lev .row{display:grid;grid-template-columns:132px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:12.8px;line-height:1.2}
.lev .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lev .bar{height:15px;border-radius:5px;background:var(--n100);overflow:hidden}
.lev .bar i{display:block;height:100%;background:var(--green-600);border-radius:5px;transition:width .25s var(--ease)}
.lev .row.top .bar i{background:var(--cereza)}
.lev .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--n700)}
.lev .k{font-weight:700;color:var(--n600)}

/* ---------- lista de KPIs ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:9px}
.kpi-grid div{border:1px solid var(--n200);border-radius:11px;padding:12px 13px;background:var(--neutral-0)}
.kpi-grid b{display:block;font-size:13.6px;font-weight:800;line-height:1.3}
.kpi-grid span{display:block;font-size:12.2px;color:var(--n600);margin-top:4px;line-height:1.4}

/* ---------- sello de metodología ---------- */
.meth{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--green-800);background:var(--green-100);border-radius:999px;padding:5px 11px}
section.room.dark .meth{background:rgba(186,244,233,.14);color:var(--green-200)}

/* ---------- correcciones de contraste en secciones oscuras ---------- */
.muted{color:var(--n600)}
section.room.dark .muted{color:var(--green-200)}
section.room.dark .stat.mint .sub,section.room.dark .stat.mint .footnote{color:var(--green-800)}
section.room.dark .stat.cream .sub,section.room.dark .stat.cream .footnote{color:var(--n600)}
section.room.dark .stat.cereza .sub,section.room.dark .stat.cereza .footnote{color:var(--cereza-200)}
section.room.dark .stat.dark .sub,section.room.dark .stat.dark .footnote{color:var(--green-200)}
section.room.dark .scrollx{color:var(--n700)}
section.room.dark td{color:var(--n700)}
section.room.dark td b{color:var(--n800)}
section.room.dark tbody tr:hover td{background:var(--green-100)}
section.room.dark .note,section.room.dark .note b{color:#4F360A}
section.room.dark a{color:var(--green-200)}

.stat{border-radius:14px;padding:19px 19px 17px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat h3{font-size:13.5px;font-weight:800;line-height:1.3;margin:0}
.stat .sub{font-size:12.5px;line-height:1.4;margin:0}
.stat .v{font-weight:300;font-size:clamp(30px,4vw,42px);line-height:1.02;letter-spacing:-0.04em;margin:auto 0 0;padding-top:10px;overflow-wrap:anywhere}
.stat .v sup{font-size:.36em;font-weight:700;vertical-align:super;margin-left:3px;letter-spacing:0}
.stat .footnote{margin-top:8px}
.stat.mint{background:var(--green-200);color:var(--green-900)}
.stat.mint .sub,.stat.mint .footnote{color:var(--green-800)}
.stat.cream{background:var(--neutral-0);color:var(--n800);border:1px solid var(--n200)}
.stat.cream .v{color:var(--green-800)}
.stat.cream .sub{color:var(--n600)}
.stat.dark{background:var(--green-800);color:var(--cream)}
.stat.dark .v,.stat.dark h3{color:#fff}
.stat.dark .sub,.stat.dark .footnote{color:var(--green-200)}
.stat.cereza{background:var(--cereza);color:#fff}
.stat.cereza .sub,.stat.cereza .footnote{color:var(--cereza-200)}

.footnote{font-size:12.3px;color:var(--n600);line-height:1.5}
section.room.dark .footnote{color:var(--green-300)}

/* ---------- insignias de evidencia ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;vertical-align:middle;line-height:1.35;white-space:nowrap}
.badge.conf{background:var(--green-100);color:var(--green-800)}
.badge.sector{background:var(--info-bg);color:#1C5A86}
.badge.hip{background:var(--warn-bg);color:#7A520E}
.badge.nd{background:var(--n100);color:var(--n600)}
.badge.legal{background:var(--cereza-200);color:#073E38}

.btn-small{font-weight:800;font-size:11.5px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--green-600);background:transparent;color:var(--green-700);cursor:pointer;transition:background .18s var(--ease)}
.btn-small:hover{background:var(--green-100)}
.pill-select{font-family:var(--font-sans);font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:999px;
  border:1px solid var(--n300);background:var(--neutral-0);color:var(--n700);transition:background .18s var(--ease),border-color .18s var(--ease)}
button.pill-select:hover{border-color:var(--green-500)}
button.pill-select.on{background:var(--green-200);color:var(--green-900);border-color:var(--green-500)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lab{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n600);margin-right:4px}

/* ---------- tablas ---------- */
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--n200);border-radius:12px;background:var(--neutral-0)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 13px;background:var(--green-800);color:var(--green-200);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:800;white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--n100);line-height:1.45;vertical-align:top}
td.nowrap{white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--green-100)}

/* ---------- fichas de producto ---------- */
.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:2px}
#berry-panel{display:flex;flex-direction:column;gap:28px;position:static}
.subtab{border:1px solid var(--n300);background:var(--neutral-0);color:var(--n700);border-radius:10px;padding:9px 14px;
  font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;transition:border-color .16s var(--ease),background .16s var(--ease)}
.subtab:hover{border-color:var(--green-500)}
.subtab.on{background:var(--green-800);border-color:var(--green-800);color:#fff}
.subtab .yr{font-size:11.5px;font-weight:800;opacity:.75}
.block{border-top:1px solid var(--n100);padding-top:14px;margin-top:14px}
.block:first-child{border-top:0;padding-top:0;margin-top:0}
.block h4{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-700);margin:0 0 8px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.block p, .block li{font-size:14.2px;line-height:1.55;color:var(--n700)}
.kv{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 14px;font-size:14px}
.kv dt{font-weight:700;color:var(--n600)}
.kv dd{margin:0;color:var(--n700)}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:8px}}

/* ---------- mapa ---------- */
.mx-grid{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(265px,1fr);gap:20px;align-items:start}
.mx-stage{position:relative;border:1px solid var(--n200);border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--green-100) 62%,var(--neutral-0))}
.mx-stage svg#mx-map{display:block;width:100%;height:auto;touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
.mx-pais{stroke:var(--n500);stroke-width:1.7;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.mx-st{fill:var(--neutral-0);stroke:var(--n300);stroke-width:.9;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .16s var(--ease)}
.mx-st.op{fill:var(--green-200)}
.mx-pin{cursor:pointer;outline:none;transition:opacity .2s var(--ease)}
.mx-pin .core{fill:var(--green-600);stroke:var(--neutral-0);stroke-width:1.8;vector-effect:non-scaling-stroke}
.mx-pin .halo{fill:var(--green-600);opacity:.18;transform-box:fill-box;transform-origin:center;pointer-events:none}
.mx-pin.alianza .core,.mx-pin.alianza .halo{fill:var(--info)}
.mx-pin.indicio .core,.mx-pin.indicio .halo{fill:var(--warn)}
.mx-pin.corporativo .core,.mx-pin.corporativo .halo{fill:var(--green-900)}
.mx-pin.dim{opacity:.22}
.mx-pin.sel .core{stroke:var(--n800);stroke-width:2.6}
.mx-pin .lbl{font-family:var(--font-sans);font-weight:700;fill:var(--n800);paint-order:stroke;stroke:var(--neutral-0);stroke-width:3;stroke-linejoin:round;pointer-events:auto;cursor:pointer}
.mx-zoom{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:2}
.mx-zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--n300);background:var(--neutral-0);color:var(--n800);
  font-size:17px;font-weight:800;line-height:1;display:grid;place-items:center;padding:0;transition:border-color .16s var(--ease),opacity .16s}
.mx-zoom button:hover:not(:disabled){border-color:var(--green-500);color:var(--green-700)}
.mx-zoom button:disabled{opacity:.4;cursor:default}
.mx-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.mx-stage.drag svg#mx-map{cursor:grabbing}
.chip-prod{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:var(--green-100);color:var(--green-800);line-height:1.3}
.mx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.8px;color:var(--n600)}
.mx-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
#mx-detail{min-height:230px}
@media (max-width:900px){.mx-grid{grid-template-columns:1fr}#mx-detail{min-height:0}}

/* ---------- jornada ---------- */
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:620px){.cal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cal .yr{border-radius:12px;padding:13px 12px;background:var(--neutral-0);border:1px solid var(--n200);text-align:left}
.cal .yr b{display:block;font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--n500)}
.cal .yr em{display:block;font-style:normal;font-weight:300;font-size:30px;line-height:1.05;letter-spacing:-.03em;color:var(--green-800);margin-top:4px}
.cal .yr span{display:block;font-size:11.5px;color:var(--n500);margin-top:4px;line-height:1.35}
.cal .yr.now{background:var(--green-800);border-color:var(--green-800)}
.cal .yr.now b,.cal .yr.now span{color:var(--green-200)}
.cal .yr.now em{color:#fff}
.cal .yr.next{border-color:var(--cereza);background:var(--cereza-200)}
.cal .yr.next b,.cal .yr.next span{color:#06433C}
.cal .yr.next em{color:var(--cereza)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;color:var(--n600);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
input[type=number]{font-family:var(--font-sans);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:700;padding:9px 11px;
  border-radius:9px;border:1px solid var(--n300);background:var(--neutral-0);color:var(--n800);width:100%}
input[type=number]:focus{border-color:var(--green-500)}
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-top:4px}
.calc-out div{background:var(--cream);border-radius:11px;padding:12px 13px}
.calc-out b{display:block;font-weight:300;font-size:26px;line-height:1.05;letter-spacing:-.03em;color:var(--green-800)}
.calc-out span{display:block;font-size:11.8px;font-weight:700;color:var(--n600);line-height:1.3;margin-top:5px}

/* ---------- oportunidades ---------- */
.opp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px}
.opp{text-align:left;background:var(--neutral-0);border:1px solid var(--n200);border-radius:13px;padding:16px;display:flex;flex-direction:column;gap:7px;
  transition:border-color .16s var(--ease),transform .16s var(--ease)}
.opp:hover{border-color:var(--green-500);transform:translateY(-1px)}
.opp.on{border-color:var(--green-700);box-shadow:0 0 0 1px var(--green-700)}
.opp .area{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-700)}
.opp .t{font-size:15px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.opp .d{font-size:13.3px;color:var(--n600);line-height:1.45}
.opp .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.cx{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.cx.baja{background:var(--green-100);color:var(--green-800)}
.cx.media{background:var(--warn-bg);color:#7A520E}
.cx.alta{background:#F6E0DB;color:#9B3B2C}
#opp-detail{position:sticky;top:120px}
@media (max-width:900px){#opp-detail{position:static}}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:900px){.detail-grid{grid-template-columns:1fr}}

.q-list{counter-reset:q}
.q-list li{counter-increment:q;list-style:none;position:relative;padding-left:30px;margin-bottom:9px;font-size:14.2px;line-height:1.5}
.q-list li::before{content:counter(q);position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--green-100);
  color:var(--green-800);font-size:11px;font-weight:800;display:grid;place-items:center}
.q-list{padding-left:0}

.note{background:var(--warn-bg);border-radius:12px;padding:14px 16px;font-size:13.6px;line-height:1.55;color:#6B4A0E}
.note b{color:#4F360A}

@media (max-width:880px){
  nav.rail .foot{display:none}
  section.room{padding:40px var(--padx) 52px}
}
@media (max-width:620px){
  body{font-size:16px}
  nav.rail .prospect span{display:none}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

/* ---------- MÓDULO · Alianza Claude Partner Network ---------- */


/* Retícula de portada: titular a la izquierda, tarjeta a la derecha.
   Si tu pieza ya tiene su propia retícula de portada, omite este bloque
   y mete la tarjeta en la columna que corresponda. */
.cpn-hero{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:44px;align-items:center;margin-top:46px}
.cpn-hero > .cpn-card{justify-self:stretch}
@media(max-width:1000px){.cpn-hero{grid-template-columns:1fr;gap:30px;margin-top:38px}}

/* Tarjeta */
.cpn-card{position:relative;border:1px solid rgba(186,244,233,.30);border-radius:22px;
  padding:26px 24px 22px;background:rgba(255,254,252,.065);overflow:hidden;
  font-family:var(--font-sans,"Manrope",Arial,sans-serif)}
.cpn-card::before{content:"";position:absolute;width:420px;height:420px;right:-180px;top:-200px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,119,87,.34),rgba(3,181,133,.18) 48%,transparent 72%);
  filter:blur(44px);pointer-events:none;animation:cpnGlow 7s ease-in-out infinite}
.cpn-card > *{position:relative;z-index:2}

.cpn-tag{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:800;color:var(--green-300,#7FE0C0)}
.cpn-tag i{width:7px;height:7px;border-radius:50%;background:var(--green-500,#03B585);
  animation:cpnPulse 2.1s ease-in-out infinite}

.cpn-link{display:flex;align-items:center;gap:10px;margin:24px 0 22px}
.cpn-mark{flex:0 1 auto;min-width:0;color:var(--cream,#F2EEEB);line-height:0}
.cpn-mark svg{width:112px;height:auto;display:block}
.cpn-wire{flex:1 1 auto;min-width:40px;line-height:0}
.cpn-wire svg{width:100%;height:22px;display:block;overflow:visible}
.cpn-star{position:relative;flex:0 0 auto;width:54px;height:54px;display:flex;align-items:center;justify-content:center}
.cpn-star::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(217,119,87,.55);
  animation:cpnHalo 3.4s ease-out infinite}
.cpn-star img{width:46px;height:46px;animation:cpnSpin 44s linear infinite}

.cpn-title{font-size:29px;font-weight:800;line-height:1.04;letter-spacing:-0.025em;color:var(--neutral-0,#FFFEFC)}
.cpn-sub{margin-top:7px;font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:800;
  color:var(--green-300,#7FE0C0)}
.cpn-desc{margin:14px 0 0;font-size:12.8px;line-height:1.5;color:var(--green-100,#DFF9F0);opacity:.9}
.cpn-foot{margin-top:18px;padding-top:15px;border-top:1px solid rgba(186,244,233,.24);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.cpn-foot img{width:112px}
.cpn-foot span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  color:var(--green-300,#7FE0C0);text-align:right;line-height:1.35}

/* Variante sobre fondo claro (crema o blanco) */
.cpn-card.is-light{border-color:var(--n200,#DCD4C9);background:var(--neutral-0,#FFFEFC)}
.cpn-card.is-light::before{background:radial-gradient(circle,rgba(217,119,87,.22),rgba(3,181,133,.14) 48%,transparent 72%)}
.cpn-card.is-light .cpn-tag{color:var(--green-700,#0A7568)}
.cpn-card.is-light .cpn-mark{color:var(--green-800,#085E54)}
.cpn-card.is-light .cpn-title{color:var(--n800,#272320)}
.cpn-card.is-light .cpn-sub{color:var(--green-700,#0A7568)}
.cpn-card.is-light .cpn-desc{color:var(--n600,#574F49);opacity:1}
.cpn-card.is-light .cpn-foot{border-top-color:var(--n200,#DCD4C9)}
.cpn-card.is-light .cpn-foot span{color:var(--green-700,#0A7568)}
.cpn-card.is-light .cpn-wire svg line{stroke:#0A7568;stroke-opacity:.45}

/* Variante compacta en línea, para pie de página o bloque de CTA */
.cpn-chip{display:inline-flex;align-items:center;gap:14px;border:1px solid rgba(186,244,233,.32);
  border-radius:14px;padding:9px 16px;background:rgba(255,254,252,.055);
  font-family:var(--font-sans,"Manrope",Arial,sans-serif)}
.cpn-chip .cl{width:30px;height:30px;flex:0 0 auto}
.cpn-chip .tx{line-height:1.2}
.cpn-chip .tx b{display:block;font-size:12.5px;font-weight:800;color:var(--neutral-0,#FFFEFC)}
.cpn-chip .tx span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--green-300,#7FE0C0);font-weight:700;margin-top:3px}
.cpn-chip .sep{width:1px;align-self:stretch;background:rgba(186,244,233,.3)}
.cpn-chip .an{width:108px;flex:0 0 auto}
.cpn-chip.on-mesh{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.12)}
.cpn-chip.on-mesh .tx span{color:rgba(255,255,255,.82)}
.cpn-chip.on-mesh .sep{background:rgba(255,255,255,.4)}

/* Animaciones */
@keyframes cpnSpin{to{transform:rotate(360deg)}}
@keyframes cpnHalo{0%{transform:scale(.86);opacity:0}35%{opacity:.85}100%{transform:scale(1.32);opacity:0}}
@keyframes cpnGlow{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes cpnPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
@keyframes cpnFlow{to{stroke-dashoffset:-28}}
@keyframes cpnDot{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(104px);opacity:0}}
.cpn-wire-line{animation:cpnFlow 1.5s linear infinite}
.cpn-wire-dot{animation:cpnDot 2.8s cubic-bezier(.45,0,.55,1) infinite}
.cpn-wire-dot.d2{animation-delay:.95s}
.cpn-wire-dot.d3{animation-delay:1.9s}

@media (prefers-reduced-motion:reduce){
  .cpn-card::before,.cpn-tag i,.cpn-star::after,.cpn-star img,.cpn-wire-line,.cpn-wire-dot{animation:none!important}
  .cpn-wire-dot{opacity:.9}
}
@media(max-width:1000px){.cpn-card{max-width:420px}}
@media(max-width:620px){
  .cpn-card{padding:22px 18px 18px}
  .cpn-title{font-size:25px}
  .cpn-mark svg{width:96px}
  .cpn-star{width:46px;height:46px}
  .cpn-star img{width:40px;height:40px}
  .cpn-chip{gap:11px;padding:8px 12px}
  .cpn-chip .an{width:88px}
  .cpn-chip .tx b{font-size:11.5px}
}


/* ============================================================
   Refinamiento visual de las fichas de cultivo
   ============================================================ */
section.room{gap:28px;animation:rise .38s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section.room{animation:none}}

.card{--tone:transparent;border-radius:16px;
  box-shadow:inset 4px 0 0 var(--tone),0 1px 2px rgba(23,21,18,.035),0 16px 30px -26px rgba(7,62,56,.45)}
.card.tone-green{--tone:var(--green-500)}
.card.tone-berry{--tone:var(--cereza)}
.card.tone-sun{--tone:var(--warn)}
.card.tone-sky{--tone:var(--info)}
.card.tone-leaf{--tone:var(--green-700)}
.card.accent{border-left:0;--tone:var(--cereza)}
section.room.dark .card.accent{--tone:var(--cereza-300)}
.grid.gstretch{align-items:stretch}
.grid.gstretch > .card{display:flex;flex-direction:column}

/* cintillo */
.p-hero{border-radius:16px}
.p-hero div{padding:16px 18px 15px 20px;position:relative;transition:background .2s var(--ease)}
.p-hero div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green-500)}
.p-hero div:nth-child(2)::before{background:var(--info)}
.p-hero div:nth-child(3)::before{background:var(--green-800)}
.p-hero div:nth-child(4)::before{background:var(--cereza)}
.p-hero div:hover{background:#F2FBF8}

/* calendario */
.cal12{gap:4px;margin-top:4px}
.cal12 .m{font-size:10.5px;color:var(--n500);margin-bottom:6px;transition:color .2s var(--ease)}
.cal12 button.on .m{color:var(--green-900)}
.cal12 .bar{height:58px;border-radius:9px;background:linear-gradient(180deg,var(--n100),var(--cream));
  box-shadow:inset 0 0 0 1px rgba(39,35,32,.05)}
.cal12 .bar i{border-radius:9px;transition:height .4s var(--ease)}
.cal12 .i1 i{background:linear-gradient(180deg,var(--green-300),var(--green-200))}
.cal12 .i2 i{background:linear-gradient(180deg,var(--green-500),var(--green-400))}
.cal12 .i3 i{background:linear-gradient(180deg,var(--green-800),var(--green-600))}
.cal12 button.on .bar{box-shadow:0 0 0 2px var(--green-900),0 8px 16px -10px rgba(7,62,56,.6)}
.cal12 .win{border-top:3px solid var(--cereza);border-radius:9px 9px 0 0}
.cal-legend{display:flex;gap:7px 15px;flex-wrap:wrap;margin-top:13px;font-size:11.3px;color:var(--n600);align-items:center}
.cal-legend span{display:inline-flex;align-items:center}
.cal-legend i{width:15px;height:8px;border-radius:3px;display:inline-block;margin-right:6px;flex:none}
.cal-note{background:linear-gradient(135deg,var(--green-100),#F5FDFA);
  border-left:3px solid var(--green-600);border-radius:0 12px 12px 0;padding:13px 16px;margin-top:14px;min-height:0;
  font-size:13.8px;line-height:1.5;color:var(--n700)}
.cal-note .mes{display:inline-flex;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:#fff;background:var(--green-800);border-radius:999px;padding:3px 10px;margin-right:9px;vertical-align:1px}
.fn-ast{font-size:11.2px;color:var(--n600);line-height:1.45;margin-top:auto;padding-top:12px}

/* cadena de valor */
.chain{gap:7px}
.chain button{display:flex;align-items:center;gap:10px;flex:1 1 148px;padding:11px 13px;border-radius:12px}
.chain .n{width:23px;height:23px;border-radius:50%;background:var(--green-100);color:var(--green-800);
  display:grid;place-items:center;font-size:10.5px;letter-spacing:0;flex:none;transition:background .2s var(--ease)}
.chain button.on{background:linear-gradient(135deg,var(--green-800),var(--green-900));border-color:var(--green-900)}
.chain button.on .n{background:var(--lime);color:#073E38}
.chain .t{margin-top:0}
.chain-detail{border-left:3px solid var(--green-700);border-radius:0 12px 12px 0;animation:rise .25s var(--ease) both}

/* simulador */
.sl input[type=range]{background:var(--n200)}
.sim-kpis div:nth-child(3){background:#E6ECF1}
.sim-kpis div:nth-child(6){background:#F7EEE1}
.sim-kpis div.hi{background:linear-gradient(135deg,var(--green-200),var(--green-100));
  box-shadow:inset 0 0 0 1px var(--green-300)}
.lev .bar i{background:linear-gradient(90deg,var(--green-700),var(--green-500))}
.lev .row.top .bar i{background:linear-gradient(90deg,var(--green-900),var(--green-600))}
.chartbox{border-radius:14px}
.sim-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:560px){.sim-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.lev .row{grid-template-columns:102px minmax(0,1fr) 58px;gap:9px;font-size:12px}}

/* modelo de indicadores */
.kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:820px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.kpi-grid{grid-template-columns:1fr}}
.kpi-grid div{position:relative;padding:14px 14px 14px 16px;transition:border-color .18s var(--ease),transform .18s var(--ease)}
.kpi-grid div::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--green-300)}
.kpi-grid div:hover{border-color:var(--green-500);transform:translateY(-1px)}

/* bloques condensados */
.kv2{display:flex;flex-direction:column;gap:11px;margin:0}
.kv2 .r{display:grid;grid-template-columns:minmax(104px,128px) 1fr;gap:4px 12px;align-items:baseline}
.kv2 .k{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--green-800)}
.kv2 .v{font-size:14px;line-height:1.45;color:var(--n700)}
.kv2 .v .badge{margin-left:6px}
@media(max-width:560px){.kv2 .r{grid-template-columns:1fr}}
.ctx{display:flex;flex-direction:column;gap:13px}
.ctx .it{border-left:2px solid var(--info);padding-left:12px}
.ctx .it b{display:block;font-size:13.2px;font-weight:800;color:var(--n800);line-height:1.3}
.ctx .it span{display:block;font-size:13.6px;line-height:1.48;color:var(--n600);margin-top:3px}
.mini-h{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-800);margin:0 0 8px}
.mini-h.alt{color:#7A520E}
.tick{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.tick li{position:relative;padding-left:19px;font-size:13.6px;line-height:1.45;color:var(--n700);margin:0}
.tick li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.tick.ok li::before{background:var(--green-500)}
.split-mini{border-top:1px solid var(--n100);margin-top:16px;padding-top:15px}


/* marcas de benchmark en los deslizadores */
.sl .trackwrap{position:relative;display:block;padding-top:9px}
.sl .trackwrap input[type=range]{margin-top:0;position:relative;z-index:2}
.sl .marks{position:absolute;left:0;right:0;top:9px;height:4px;pointer-events:none;z-index:1}
.sl .marks .mk{position:absolute;top:-5px;width:2px;height:14px;border-radius:2px;transform:translateX(-1px)}
.mk{display:inline-block}
.mk.media{background:var(--n500)}
.mk.best{background:var(--green-500)}
.sl .bench{display:block;font-size:11.2px;line-height:1.45;color:var(--n600);margin-top:9px}
.sl .bench .mk{width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.sl .bench .mk.best{margin-left:6px;margin-right:0}
.sl .bench em{font-style:normal;font-weight:800;color:#8A5A1E}
.sl .bench em.up{color:var(--green-700)}
.sl.has-bench{margin-bottom:17px}


/* fases, agentes y cierre de próximos pasos */
.card.fase{position:relative;padding-top:26px}
.fnum{position:absolute;right:18px;top:16px;font-size:30px;font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--green-700);opacity:.28}
.ag{background:var(--cream);border-radius:12px;padding:14px 15px}
.ag b{display:block;font-size:13.4px;font-weight:800;line-height:1.3;color:var(--n800)}
.ag span{display:block;font-size:12.8px;line-height:1.45;color:var(--n600);margin-top:5px}
.card.cta{background:linear-gradient(135deg,var(--green-900),#04302c 75%);border-color:var(--green-900);color:var(--green-100);--tone:var(--cereza)}
.card.cta h3{color:var(--neutral-0)}
.card.cta p{color:var(--green-100);font-size:14.6px;max-width:72ch}
.card.cta .eyebrow{color:var(--cereza-300)}
.card.cta .eyebrow::after{display:none}


/* ilustración de cultivo */
section.room{position:relative;overflow-x:clip}
section.room > *{position:relative;z-index:1}
section.room .p-art{position:absolute;top:-6px;right:-18px;width:310px;max-width:38vw;z-index:0;pointer-events:none;
  opacity:.5;animation:artIn .9s cubic-bezier(.16,1,.3,1) both}
.p-art svg{display:block;width:100%;height:auto;overflow:visible}
.p-art .a1{animation:artIn 1s cubic-bezier(.16,1,.3,1) .1s both}
.p-art .a2{animation:artIn 1.05s cubic-bezier(.16,1,.3,1) .26s both}
.p-art::after{content:"";position:absolute;inset:-14% -8% -6% -14%;z-index:-1;border-radius:50%;
  background:radial-gradient(circle at 60% 40%,rgba(3,181,133,.16),transparent 68%)}
@keyframes artIn{from{opacity:0;transform:translateX(110px) rotate(-7deg) scale(.9)}to{opacity:1;transform:none}}
@media(max-width:1100px){.p-art{width:230px;opacity:.35}}
@media(max-width:760px){.p-art{display:none}}
@media (prefers-reduced-motion:reduce){.p-art,.p-art .a1,.p-art .a2{animation:none}}


/* insignia de proyecto LONCER */
.badge.loncer{background:var(--green-800);color:var(--green-200)}
section.room.dark .badge.loncer{background:var(--lime);color:#073E38}

/* mini indicadores */
.mini-stat{background:var(--cream);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:5px}
.mini-stat b{font-weight:300;font-size:27px;line-height:1.02;letter-spacing:-.03em;color:var(--green-800)}
.mini-stat span{font-size:12.6px;line-height:1.4;color:var(--n600);font-weight:600}
.mini-stat.alt{background:var(--neutral-0);border:1px solid var(--n200)}

/* barras comparativas */
.bc{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.bc-row{display:grid;grid-template-columns:118px minmax(0,1fr) 92px;gap:12px;align-items:center}
.bc-k{font-size:12.8px;font-weight:700;color:var(--n700);line-height:1.2}
.bc-bars{display:flex;flex-direction:column;gap:3px}
.bc-b{display:block;height:11px;border-radius:4px;min-width:2px}
.bc-b.real{background:linear-gradient(90deg,var(--green-800),var(--green-600))}
.bc-b.ppto{background:var(--n200)}
.bc-v{text-align:right;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;color:var(--n800)}
.bc-v em{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--n500);margin-top:2px}
.bc-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:11.3px;color:var(--n600);align-items:center}
.bc-leg i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:6px}
.bc-leg i.real{background:var(--green-700)}.bc-leg i.ppto{background:var(--n200)}
.bc-leg .bc-u{margin-left:auto;font-weight:700}
@media(max-width:560px){.bc-row{grid-template-columns:92px minmax(0,1fr) 76px;gap:8px}}

/* plan de hectáreas */
.plan-ch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end;margin-top:8px}
.plan-col{display:flex;flex-direction:column;align-items:center;gap:7px}
.plan-t{font-size:12px;font-weight:800;color:var(--green-800)}
.plan-stack{width:100%;max-width:74px;display:flex;flex-direction:column;border-radius:8px;overflow:hidden}
.plan-stack i{display:block;width:100%}
.plan-y{font-size:12px;font-weight:700;color:var(--n600)}

/* flujo de planeación con IA */
.flow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:6px}
.flow3 > div{background:var(--cream);border-radius:13px;padding:15px 16px}
.flow3 .flow-mid{background:var(--green-800);color:var(--green-100)}
.flow3 .flow-mid .mini-h{color:var(--lime)}
.flow3 .flow-mid .tick li{color:var(--green-100)}
.flow3 .flow-mid .tick li::before{background:var(--lime)}
@media(max-width:860px){.flow3{grid-template-columns:1fr}}

/* mejores prácticas */
.prac{border:1px solid var(--n200);border-radius:13px;padding:14px 15px;display:flex;flex-direction:column;gap:6px}
.prac-k{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-700)}
.prac b{font-size:13.8px;line-height:1.3}
.prac span{font-size:12.8px;line-height:1.45;color:var(--n600)}

/* horizontes */
.hz{border-radius:14px;padding:17px 18px;background:var(--cream)}
.hz h4{font-size:18px;font-weight:800;margin:4px 0 12px}
.hz-p{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green-700)}
.hz1{background:var(--green-100)}
.hz2{background:var(--green-200)}
.cx.hz-tag{background:var(--n100);color:var(--n600)}

/* inversión */
.card.cta .inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:26px}
.inv-v{font-weight:300;font-size:40px;line-height:1.02;letter-spacing:-.035em;color:#fff;margin:8px 0 4px}
.inv-s{font-size:13px;font-weight:700;color:var(--lime);margin-bottom:10px}
.card.cta .tick li{color:var(--green-100)}
.card.cta .tick.ok li::before{background:var(--lime)}
.cpn-slot{margin-top:18px;display:flex;justify-content:center}
.cpn-slot .cpn-card{max-width:420px}


.ref-loncer{margin-top:16px;background:var(--green-100);border-radius:13px;padding:15px 16px}
.rl-h{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--green-800);margin-bottom:12px}
.rl-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.rl-g div{background:var(--neutral-0);border-radius:10px;padding:11px 12px}
.rl-g b{display:block;font-weight:300;font-size:24px;line-height:1.03;letter-spacing:-.03em;color:var(--green-800)}
.rl-g span{display:block;font-size:11.6px;line-height:1.35;color:var(--n600);font-weight:600;margin-top:4px}
.rl-f{font-size:11.4px;color:var(--n600);line-height:1.45;margin-top:11px}


.bc-v small{display:inline;font-size:10.5px;font-weight:700;color:var(--n500);margin-left:2px}
.sim-kpis div.neg{background:#F7E2DD;box-shadow:inset 0 0 0 1px #E0A99D}
.sim-kpis div.neg b{color:#A33724}
.sim-kpis div.neg span{color:#8A3421}
.room-head.wide{max-width:none}
.room-head.wide h2{font-size:clamp(27px,3.3vw,41px);max-width:26ch;line-height:1.1}
ul.lead3{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:11px;max-width:60ch}
ul.lead3 li{position:relative;padding-left:21px;font-size:15.3px;line-height:1.5;color:var(--n600);margin:0}
ul.lead3 li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%;background:var(--green-500)}
ul.lead3 li b{color:var(--n800)}
section.room.dark ul.lead3 li{color:var(--green-100)}
section.room.dark ul.lead3 li b{color:var(--neutral-0)}
section.room.dark ul.lead3 li::before{background:var(--lime)}

#j-anios{grid-auto-rows:30px}
#j-anios .row{grid-template-columns:104px minmax(0,1fr) 72px}
#j-controls .sl{margin-bottom:17px}
</style>

  {t:'Contexto varietal del canal', ev:'sector', html:'<p>Driscoll’s comercializa variedades desarrolladas por su propio programa de mejoramiento y su fruta la producen agricultores independientes bajo licencia. Esto suele implicar que el catálogo varietal, la ventana de cosecha y el estándar de calidad los define el comercializador, no el productor.</p>'},
  {t:'Ubicaciones y zonas de cultivo', ev:'val', html:'<p>La administración y la planta están en Tangancícuaro, Michoacán, y la empresa declara presencia en cinco estados con sucursales en Sonora, Baja California Sur y Jalisco. No publica qué cultivo opera en cada sitio, por lo que la asignación fresa–ubicación debe confirmarse en sesión.</p>'},
  {t:'Hectáreas y producción', ev:'nd', html:'<p>No hay superficie, volumen ni rendimiento publicados para la fresa de El Cerezo en ninguna fuente corporativa, sectorial o gubernamental consultada.</p>'},
  {t:'Ciclo y ventana comercial', ev:'sector', html:'<p>La ventana de invierno es la que concentra hoy el riesgo comercial: la investigación antidumping de Estados Unidos define como mercancía investigada la fresa fresca y refrigerada mexicana que entra entre el 1 de noviembre y el 31 de marzo.</p>'},
  {t:'Mercados y canales', ev:'conf', html:'<p>Grupo Agrícola El Cerezo aparece en el listado de productores mexicanos de la petición antidumping presentada en Estados Unidos, con el domicilio de su corporativo en Zapopan. Es la evidencia pública más directa de que la fresa de la empresa llega al mercado estadounidense.</p><p class="footnote" style="margin-top:8px">Fuente: anexo de productores extranjeros de la petición <em>Fresh Winter Strawberries from Mexico</em>, diciembre de 2025.</p>'},
  {t:'Factores críticos del negocio', ev:'sector', html:'<ul>'+
    '<li><b>Antidumping vigente en fase preliminar.</b> El 18 de agosto de 2026 el Departamento de Comercio determinó preliminarmente venta por debajo de valor normal, con márgenes de 3.37% a 5.28% y una tasa de 4.83% para el resto de los exportadores; desde entonces se exigen depósitos en efectivo a los importadores. La determinación final de Commerce se espera alrededor de enero de 2027 y la de la ITC a principios de 2027.</li>'+
    '<li><b>Precio en caída.</b> En el primer semestre de 2026 el valor exportado de fresa mexicana pasó de 745.5 a 523.1 millones de dólares, una baja de 29.8%.</li>'+
    '<li><b>Certificación laboral.</b> El sector de berries se incorpora al Certificado Laboral para la Agroexportación en octubre de 2027.</li>'+
    '</ul>'},
  {t:'Hipótesis de mejora operativa', ev:'hip', html:'<ul>'+
    '<li>Si el precio por kilo exportado está bajo presión, el margen se defiende por costo por kilo y por porcentaje de fruta de primera, no por volumen.</li>'+
    '<li>El expediente antidumping exige responder cuestionarios con costos y precios por operación; la calidad del dato transaccional deja de ser un tema administrativo y pasa a ser exposición financiera.</li>'+
    '<li>La trazabilidad lote–embarque–cobro probablemente vive repartida entre SAP, hojas de cálculo y bitácoras de papel.</li>'+
    '</ul>'},
  {t:'Casos de uso digitales y de IA', ev:'hip', html:'<ul>'+
    '<li>Costeo por lote y por kilo exportable, con cierre semanal en vez de mensual.</li>'+
    '<li>Expediente digital de precios y costos por operación, listo para auditoría comercial o requerimiento de autoridad.</li>'+
    '<li>Pronóstico de cosecha por huerta y semana para comprometer volumen con el comercializador.</li>'+
    '</ul>'},
  {t:'Indicadores sugeridos', ev:'hip', html:'<ul><li>Costo por kilo exportable por huerta y por semana</li><li>Porcentaje de fruta de primera contra fruta de proceso</li><li>Kilos por jornal y por hectárea</li><li>Días de cartera por cliente y por temporada</li><li>Tiempo de cierre de la información de cosecha</li></ul>'},
  {t:'Preguntas para la sesión de diagnóstico', ev:'val', html:'<ol class="q-list">'+
    '<li>¿Qué proporción del volumen de fresa va a la ventana de invierno que cubre la investigación antidumping?</li>'+
    '<li>¿Quién responde hoy los requerimientos de información de costos y precios, y en cuántos días se arman?</li>'+
    '<li>¿El costo por kilo se conoce por huerta y por semana, o solo al cierre contable?</li>'+
    '<li>¿Qué tanto se sigue usando la captura en campo que dejamos instalada, y en qué zonas se dejó de usar?</li>'+
    '</ol>'}
 ]
},
{
 id:'frambuesa', fam:'berries', nombre:'Frambuesa', desde:'2007',
 lead:'Incorporada en 2007 junto con el arándano. Hoy es la berry con mayor crecimiento proyectado en volumen nacional, pero con precio a la baja.',
 bloques:[
  {t:'Descripción y variedades', ev:'conf', html:'<p>La frambuesa se incorporó en 2007, en la misma ampliación que sumó el arándano al portafolio.</p><p class="footnote" style="margin-top:8px">Fuente: sitio corporativo, sección Somos. Variedades y proveedor genético no publicados. '+bdg('nd')+'</p>'},
  {t:'Ubicaciones y zonas de cultivo', ev:'val', html:'<p>No se publica la asignación por estado. La planta y la administración están en Tangancícuaro, Michoacán.</p>'},
  {t:'Hectáreas y producción', ev:'nd', html:'<p>Sin datos públicos de superficie ni volumen para la empresa.</p>'},
  {t:'Ciclo y estacionalidad', ev:'val', html:'<p>El calendario de producción de la empresa no es público. La frambuesa en México se maneja con ventanas largas y picos que dependen de variedad, altitud y manejo bajo macrotúnel.</p>'},
  {t:'Mercados y canales', ev:'sector', html:'<p>Alrededor del 80% del volumen exportado de berries mexicanas se destina a Estados Unidos en el marco del T-MEC. En el primer semestre de 2026 el grupo de frambuesas, zarzamoras y moras concentró 48.9% del valor exportado de berries.</p>'},
  {t:'Factores críticos del negocio', ev:'sector', html:'<ul>'+
    '<li>En la temporada 2025/26 frambuesa y zarzamora alcanzaron volúmenes récord con crecimiento cercano a 20%, pero el valor subió solo 10% por caída de precios ante mayor oferta.</li>'+
    '<li>En el primer semestre de 2026 el valor exportado del grupo frambuesa–zarzamora bajó 12%, de 1,130.5 a 994.5 millones de dólares.</li>'+
    '<li>Aneberries reporta una reducción cercana a 12 mil hectáreas de berries en el país y menores retornos para el productor; el volumen se ha sostenido por mayor rendimiento por planta.</li>'+
    '</ul>'},
  {t:'Hipótesis de mejora operativa', ev:'hip', html:'<ul>'+
    '<li>Con precio a la baja y rendimiento al alza, la variable de control es el costo de cosecha por kilo: cuadrillas, tiempos muertos y segunda pasada.</li>'+
    '<li>La decisión de cuántas veces pasar por un surco rara vez se toma con dato de rendimiento marginal.</li>'+
    '</ul>'},
  {t:'Casos de uso digitales y de IA', ev:'hip', html:'<ul><li>Productividad por cuadrilla y por pizcador con captura en campo.</li><li>Modelo de decisión de corte: cuándo la pasada adicional deja de pagar el jornal.</li><li>Pronóstico de volumen semanal por huerta para programar empaque y transporte.</li></ul>'},
  {t:'Indicadores sugeridos', ev:'hip', html:'<ul><li>Kilos por jornal por cuadrilla</li><li>Costo de cosecha por kilo</li><li>Porcentaje de fruta rechazada en recibo</li><li>Cumplimiento del pronóstico semanal contra entrega real</li></ul>'},
  {t:'Preguntas para la sesión de diagnóstico', ev:'val', html:'<ol class="q-list"><li>¿Se mide productividad por cuadrilla todos los días, o solo el volumen total de la huerta?</li><li>¿Cómo se decide el número de pasadas por surco?</li><li>¿Qué tan lejos queda el pronóstico de la entrega real en una semana típica?</li></ol>'}
 ]
},
{
 id:'zarzamora', fam:'berries', nombre:'Zarzamora', desde:'2014',
 lead:'El cultivo más reciente de la familia de berries, en el país que lidera la producción mundial de esta fruta.',
 bloques:[
  {t:'Descripción y variedades', ev:'conf', html:'<p>La zarzamora se incorporó al portafolio en 2014.</p><p class="footnote" style="margin-top:8px">Fuente: sitio corporativo, sección Somos. Variedades no publicadas. '+bdg('nd')+'</p>'},
  {t:'Ubicaciones y zonas de cultivo', ev:'val', html:'<p>Sin asignación pública por estado. El valle de Zamora–Tangancícuaro y el valle de Los Reyes son las zonas zarzamoreras de referencia en Michoacán.</p>'},
  {t:'Hectáreas y producción', ev:'nd', html:'<p>Sin datos públicos de superficie ni volumen para la empresa.</p>'},
  {t:'Mercados y canales', ev:'sector', html:'<p>México es el primer productor mundial de zarzamora y abastece a más de 41 mercados internacionales.</p>'},
  {t:'Factores críticos del negocio', ev:'sector', html:'<ul><li>Volumen récord en 2025/26 con crecimiento cercano a 20%, acompañado de caída de precio.</li><li>Alta dependencia del mercado estadounidense y concentración productiva en pocas entidades.</li><li>La cadena es intensiva en mano de obra y la pizca la realizan mayoritariamente mujeres jornaleras.</li></ul>'},
  {t:'Hipótesis de mejora operativa', ev:'hip', html:'<ul><li>En un cultivo de pizca manual intensiva, la diferencia entre huertas suele estar en la supervisión y no en la genética.</li><li>La comparabilidad entre sitios exige una definición única de jornal, kilo y merma.</li></ul>'},
  {t:'Casos de uso digitales y de IA', ev:'hip', html:'<ul><li>Tablero comparativo entre huertas con la misma definición de indicadores.</li><li>Alertas de desviación de rendimiento por surco o sección.</li></ul>'},
  {t:'Indicadores sugeridos', ev:'hip', html:'<ul><li>Kilos por hectárea por semana</li><li>Dispersión de rendimiento entre huertas comparables</li><li>Costo por kilo puesto en empaque</li></ul>'},
  {t:'Preguntas para la sesión de diagnóstico', ev:'val', html:'<ol class="q-list"><li>¿Las huertas se comparan entre sí con la misma definición de indicadores?</li><li>¿Qué explica hoy la diferencia entre la mejor y la peor huerta?</li></ol>'}
 ]
},
{
 id:'arandano', fam:'berries', nombre:'Arándano', desde:'2007',
 lead:'La única berry mexicana que creció en valor exportado en 2026 y la apuesta del sector para diversificar destinos.',
 bloques:[
  {t:'Descripción y variedades', ev:'conf', html:'<p>El arándano se incorporó en 2007. La comunicación de reclutamiento de la empresa menciona cuadrillas de arándano con trabajo durante todo el año, lo que sugiere operación con ventana extendida; conviene confirmarlo.</p><p class="footnote" style="margin-top:8px">Fuente: sitio corporativo y canales oficiales de reclutamiento. '+bdg('val')+'</p>'},
  {t:'Ubicaciones y zonas de cultivo', ev:'val', html:'<p>Sin asignación pública por estado. Las regiones de referencia del arándano mexicano son Michoacán, Jalisco, Baja California, Guanajuato y Sinaloa.</p>'},
  {t:'Hectáreas y producción', ev:'nd', html:'<p>Sin datos públicos de superficie ni volumen para la empresa.</p>'},
  {t:'Mercados y canales', ev:'sector', html:'<p>Aneberries estimó una producción nacional de 90 mil toneladas en 2026, de las cuales cerca de 75 mil se destinarían a exportación, con Europa y Asia como destinos estratégicos para fruta diferenciada por calidad, firmeza, sabor, inocuidad, trazabilidad y vida de anaquel.</p>'},
  {t:'Factores críticos del negocio', ev:'sector', html:'<ul><li>En el primer semestre de 2026 el arándano fue el único grupo que creció: de 454.2 a 516.4 millones de dólares, 13.7% más.</li><li>La presión de precio viene de la oferta peruana.</li><li>El acceso a destinos de valor se gana con atributos de calidad y vida poscosecha, no con volumen.</li></ul>'},
  {t:'Hipótesis de mejora operativa', ev:'hip', html:'<ul><li>Si la diferenciación es por calidad y vida de anaquel, el control de temperatura y tiempo desde corte hasta enfriamiento es el proceso crítico.</li><li>El dato de cadena de frío rara vez se analiza contra el resultado de calidad en destino.</li></ul>'},
  {t:'Casos de uso digitales y de IA', ev:'hip', html:'<ul><li>Trazabilidad de tiempo–temperatura por lote, de corte a embarque.</li><li>Correlación entre condiciones de manejo y reclamos de calidad en destino.</li><li>Clasificación asistida por visión para firmeza y calibre.</li></ul>'},
  {t:'Indicadores sugeridos', ev:'hip', html:'<ul><li>Minutos de corte a enfriamiento</li><li>Porcentaje de lotes fuera de rango de temperatura</li><li>Reclamos de calidad por mil cajas</li><li>Vida de anaquel efectiva por variedad</li></ul>'},
  {t:'Preguntas para la sesión de diagnóstico', ev:'val', html:'<ol class="q-list"><li>¿Cuánto tiempo pasa entre el corte y el enfriamiento en una jornada normal?</li><li>¿Existe registro de temperatura por lote y se revisa contra reclamos de destino?</li><li>¿Qué porcentaje del arándano va a mercados distintos de Estados Unidos?</li></ol>'}
 ]
},
{
 id:'esparrago', fam:'solo', nombre:'Espárrago', desde:'2016',
 lead:'El cultivo más joven del portafolio y el único del que la empresa publica variedades y calibres.',
 bloques:[
  {t:'Descripción y variedades', ev:'conf', html:'<p>La empresa produce espárrago verde fresco y publica sus variedades y calibres:</p>'+
    '<dl class="kv" style="margin-top:10px"><dt>Variedades</dt><dd>Atlas y Early California</dd><dt>Calibres</dt><dd>Jumbo, Large, Standard y Small</dd><dt>Certificación declarada</dt><dd>PrimusGFS</dd><dt>Incorporación</dt><dd>2016</dd></dl>'+
    '<p class="footnote" style="margin-top:10px">Fuente: sitio corporativo, ficha de Espárragos.</p>'},
  {t:'Ubicaciones y zonas de cultivo', ev:'hip', html:'<p>La empresa no publica dónde cultiva el espárrago. Tiene sucursal en Sonora desde 2006 y en Baja California Sur desde 2010, y alianza comercial para papa en Caborca. Caborca es el epicentro nacional del espárrago, lo que hace razonable la hipótesis de operación en el noroeste, pero no está confirmada.</p>'},
  {t:'Hectáreas y producción', ev:'nd', html:'<p>Sin datos públicos de superficie ni volumen para la empresa.</p>'},
  {t:'Ciclo y estacionalidad', ev:'sector', html:'<p>En Sonora la temporada de cosecha del ciclo 2025–2026 arrancó formalmente a fines de febrero de 2026 en Caborca. Es una ventana corta y muy intensiva en mano de obra.</p>'},
  {t:'Escala de la región de referencia', ev:'sector', html:'<ul><li>Sonora produjo 167,988 toneladas en el ciclo 2024–2025, cerca del 60% del volumen nacional.</li><li>El arranque de temporada 2025–2026 movilizó a más de 45 mil jornaleros provenientes de otros estados.</li><li>La producción se sostiene con riego por goteo, monitoreo de humedad y fertirriego en una de las zonas más áridas del país, donde la disponibilidad de agua agrícola ha disminuido.</li></ul>'},
  {t:'Mercados y canales', ev:'sector', html:'<p>El espárrago sonorense se destina mayoritariamente a exportación hacia Estados Unidos, con presencia también en Europa y Asia.</p>'},
  {t:'Factores críticos del negocio', ev:'sector', html:'<ul><li>Agua: el rendimiento por metro cúbico es la variable económica central en zona desértica.</li><li>Pico de mano de obra concentrado en pocas semanas, con personal migrante y necesidad de albergue y transporte.</li><li>Calibre y frescura definen el precio; el espárrago pierde valor con horas, no con días.</li></ul>'},
  {t:'Hipótesis de mejora operativa', ev:'hip', html:'<ul><li>La ventana corta convierte cualquier retraso de cuadrilla, transporte o empaque en producto de menor calibre o menor precio.</li><li>La planeación de personal para el pico probablemente se hace con experiencia y no con modelo de demanda de jornales.</li><li>Con la jornada de 46 horas en 2027, un pico de cosecha que hoy se cubre con horas largas requerirá rotación o más cabezas.</li></ul>'},
  {t:'Casos de uso digitales y de IA', ev:'hip', html:'<ul><li>Modelo de requerimiento de jornales por semana de temporada y por hectárea.</li><li>Programación de corte, transporte y empaque como una sola secuencia.</li><li>Control de lámina de riego y rendimiento por metro cúbico.</li></ul>'},
  {t:'Indicadores sugeridos', ev:'hip', html:'<ul><li>Kilos por metro cúbico de agua</li><li>Mezcla de calibres por lote y precio promedio ponderado</li><li>Horas de corte a enfriamiento</li><li>Jornales planeados contra jornales efectivos en el pico</li></ul>'},
  {t:'Preguntas para la sesión de diagnóstico', ev:'val', html:'<ol class="q-list"><li>¿Dónde se produce el espárrago y bajo qué figura: superficie propia, arrendada o administrada?</li><li>¿Cómo se planea el personal para el pico de temporada?</li><li>¿Se mide rendimiento por metro cúbico de agua?</li><li>¿Qué pasa con la mezcla de calibres cuando se retrasa un corte?</li></ol>'}
 ]
},
{
 id:'aguacate', fam:'solo', nombre:'Aguacate', desde:'Sin fecha pública',
 lead:'El producto del portafolio con el cambio regulatorio más inmediato: desde el 1 de octubre de 2026 la exportación depende de un certificado laboral.',
 bloques:[
  {t:'Descripción y proceso declarado', ev:'conf', html:'<p>La empresa declara normas de calidad de exportación y señala como característica propia la selección e higiene en el manejo del aguacate durante corte, transporte y empaque.</p><p class="footnote" style="margin-top:8px">Fuente: sitio corporativo, ficha de Aguacate. No publica variedades, superficie ni si exporta de forma directa o a través de un empaque certificado. '+bdg('nd')+'</p>'},
  {t:'Ubicaciones y zonas de cultivo', ev:'val', html:'<p>No publicadas. Michoacán y Jalisco son las únicas regiones autorizadas para exportar aguacate a Estados Unidos, y la empresa opera en ambos estados.</p>'},
  {t:'Hectáreas y producción', ev:'nd', html:'<p>Sin datos públicos de superficie ni volumen para la empresa.</p>'},
  {t:'Marco regulatorio aplicable hoy', ev:'legal', html:'<ul>'+
    '<li><b>Certificado Laboral para la Agroexportación.</b> Obligatorio para exportadores de aguacate desde el 1 de octubre de 2026, a través de la plataforma VELAGRO de la STPS. El primer certificado tuvo vigencia del 1 de octubre al 7 de noviembre de 2026.</li>'+
    '<li><b>Alcance de cadena de valor.</b> La certificación se extiende a productores, huertos, empaques y proveedores de servicios agrícolas; del 1 al 7 de noviembre de 2026 corresponde la carga de información de la cadena de valor y entre enero y abril de 2027 se incorporan gradualmente los registros patronales del IMSS.</li>'+
    '<li><b>Base legal.</b> Artículo 283 Quáter de la Ley Federal del Trabajo; disposiciones generales publicadas el 15 de junio de 2026 y lineamientos de operación de VELAGRO publicados el 15 de septiembre de 2026.</li>'+
    '<li><b>Cero deforestación.</b> Solo puede exportarse aguacate de huertos libres de deforestación desde 2019, con certificación ambiental.</li>'+
    '</ul>'},
  {t:'Mercados y canales', ev:'sector', html:'<p>En la temporada 2025–2026 Michoacán destinó 1,462,973 toneladas de aguacate a exportación, con un ingreso estimado de 3,500 millones de dólares.</p>'},
  {t:'Factores críticos del negocio', ev:'sector', html:'<ul><li>El certificado laboral es una restricción no arancelaria: sin él no se despacha la mercancía.</li><li>La prueba de cumplimiento ya no es de la empresa sola, sino de toda su cadena de valor, incluidos terceros de corte y empaque.</li><li>La STPS usa un factor técnico que vincula toneladas exportadas con mano de obra registrada, lo que obliga a que los números de nómina, IMSS y embarque cuadren entre sí.</li></ul>'},
  {t:'Hipótesis de mejora operativa', ev:'hip', html:'<ul><li>El expediente laboral de la cadena de valor probablemente se arma hoy de forma manual y por evento, no como proceso continuo.</li><li>Si la empresa usa cuadrillas de corte de terceros, la trazabilidad de su alta en IMSS es el eslabón frágil.</li><li>La consistencia entre toneladas embarcadas y jornales registrados es verificable y debe poder reproducirse en cualquier momento.</li></ul>'},
  {t:'Casos de uso digitales y de IA', ev:'hip', html:'<ul><li>Expediente digital de cumplimiento laboral por participante de la cadena, con vencimientos y alertas.</li><li>Conciliación automática entre toneladas exportadas, nómina y registros patronales.</li><li>Asistente que arma y revisa el paquete documental antes de cada renovación del certificado.</li></ul>'},
  {t:'Indicadores sugeridos', ev:'hip', html:'<ul><li>Porcentaje de la cadena de valor con expediente completo y vigente</li><li>Días para integrar el paquete de renovación</li><li>Diferencia entre jornales registrados y jornales implícitos por tonelada</li><li>Incidencias de rechazo o prevención por parte de la autoridad</li></ul>'},
  {t:'Preguntas para la sesión de diagnóstico', ev:'val', html:'<ol class="q-list"><li>¿La empresa exporta aguacate de forma directa o entrega a un empaque exportador?</li><li>¿Quién es responsable del trámite del certificado y con qué información lo arma?</li><li>¿Qué proporción del corte lo realiza personal propio y qué proporción cuadrillas de terceros?</li><li>¿Los huertos cuentan ya con el dictamen de cero deforestación?</li></ol>'}
 ]
},
{
 id:'papa', fam:'solo', nombre:'Papa', desde:'1989',
 lead:'El cultivo más antiguo del grupo después del frijol, con producción declarada todos los meses del año y laboratorio propio.',
 bloques:[
  {t:'Descripción y variedades', ev:'conf', html:'<p>La empresa declara producción de papa con estándares de calidad internacional, con una ventaja explícita: producción todos los meses del año.</p>'+
    '<dl class="kv" style="margin-top:10px"><dt>Calibres</dt><dd>Primera, segunda, tercera y cuarta</dd><dt>Certificaciones declaradas</dt><dd>SNICS, NOM-040 y NOM-041, FITO 2002</dd><dt>Capacidad declarada</dt><dd>Laboratorio propio y presencia en todo el proceso</dd><dt>Incorporación</dt><dd>1989, junto con el brócoli</dd></dl>'+
    '<p class="footnote" style="margin-top:10px">Fuente: sitio corporativo, fichas de Papa y Semilla de Papa, y sección Somos. Las variedades específicas no se publican. '+bdg('nd')+'</p>'},
  {t:'Ubicaciones y alianzas', ev:'conf', html:'<p>La empresa declara alianzas comerciales para producción de papa en <b>Perote, Veracruz</b> y en <b>Caborca, Sonora</b>. Ambas aparecen en el mapa operativo como presencia de alianza, no como campo propio confirmado.</p>'},
  {t:'Hectáreas y producción', ev:'nd', html:'<p>Sin superficie, volumen ni rendimiento publicados para la empresa.</p>'},
  {t:'Ciclo y estacionalidad', ev:'conf', html:'<p>Producción declarada en los doce meses del año. Esa continuidad solo es posible combinando regiones con ciclos distintos, lo que en la práctica significa operar varias ventanas en paralelo.</p>'},
  {t:'Contexto del mercado nacional', ev:'sector', html:'<ul>'+
    '<li>México produjo alrededor de 2.16 millones de toneladas en 2025 y la Confederación Nacional de Productores de Papa anticipa un cierre de 2026 cercano a 2 millones por menor superficie sembrada tras la sobreoferta del año anterior.</li>'+
    '<li>Las exportaciones de papa fresca de Estados Unidos a México pasaron de 123 mil toneladas en 2021/22 a 274 mil toneladas en 2025/26, un alza de 123% en volumen desde la apertura total del mercado en mayo de 2022.</li>'+
    '<li>El rendimiento medio nacional supera las 30 toneladas por hectárea y la sanidad del suelo es la preocupación central del sector frente a la papa importada.</li>'+

   Componentes visuales de las fichas por cultivo
   ============================================================ */
var FACTOR_SEGUNDA = 0.45;

function nf(v,d){ return (+v).toLocaleString('es-MX',{minimumFractionDigits:d||0, maximumFractionDigits:d||0}); }
function mxn(v){
  var a = Math.abs(v);
  if(a >= 1000000) return (v<0?'-$':'$') + nf(a/1000000,1) + ' M';
  if(a >= 1000) return (v<0?'-$':'$') + nf(a/1000,0) + ' k';
  return (v<0?'-$':'$') + nf(a,0);
}
function calcula(s){
  var kg = s.ha * s.rend * 1000;
  var kgP = kg * s.prim/100, kgS = kg - kgP;
  var ingreso = kgP*s.precio + kgS*s.precio*FACTOR_SEGUNDA;
  var costoProd = s.ha*s.costoHa, costoLab = s.ha*s.jornales*s.jornal;
  var costo = costoProd + costoLab;
  var jorn = s.ha*s.jornales;
  return {kg:kg, t:kg/1000, ingreso:ingreso, costo:costo, costoProd:costoProd, costoLab:costoLab,
    margen:ingreso-costo, margenHa:(ingreso-costo)/Math.max(1,s.ha), costoKg:costo/Math.max(1,kg),
    kgJornal:kg/Math.max(1,jorn), jornales:jorn,
    pEq:costo/Math.max(1,(kgP + kgS*FACTOR_SEGUNDA)),
    costoLabKg:costoLab/Math.max(1,kg)};
}

function rango(d, base){
  if(d.fijo) return {min:d.fijo[0], max:d.fijo[1], step:d.fijo[2]};
  var min = base*d.f[0], max = base*d.f[1];
  var span = max-min, step;
  var escala = Math.pow(10, Math.floor(Math.log(span/40)/Math.LN10));
  step = escala; if(span/step > 80) step *= 5; if(span/step < 15) step /= 2;
  min = Math.max(step, Math.floor(min/step)*step);
  max = Math.ceil(max/step)*step;
  return {min:min, max:max, step:step};
}


function refLoncer(id){
  var ha = (typeof HA22!=='undefined') ? HA22[id] : null;

  if((!ha || ha[0]==null) && (!ck || ck[0]==null)) return '';
  var h = '<div class="ref-loncer"><span class="rl-h">Referencia del proyecto LONCER '+bdg('loncer')+'</span><div class="rl-g">';
  if(ha && ha[0]!=null){
    h += '<div><b>'+ha[0].toLocaleString('es-MX')+' ha</b><span>Superficie del plan 22/23, cargada en el simulador</span></div>';
    h += '<div><b>'+ha[1].toLocaleString('es-MX')+' ha</b><span>Meta del plan para la temporada 26/27</span></div>';
  }
  if(ck && ck[0]!=null){
    var dif = (ck[0]-ck[1])/ck[1]*100;
    h += '<div><b>$'+ck[0].toFixed(2)+'</b><span>Costo por kilo real 2022, en dólares</span></div>';

  }
  return h + '</div><p class="rl-f">Datos históricos de la temporada 2022. Parte del prediagnóstico es comparar estas cifras contra la operación de hoy.</p></div>';
}
